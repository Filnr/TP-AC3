# power.cfg - parametros lidos pelo tools/mcpat.py do Sniper (nao alteram o desempenho simulado).
# Incluido pelos scripts do Membro 3 com "-c power", depois do cenario.
#
# technology_node: o McPAT 1.0 que acompanha o Sniper so tem modelos de 90/65/45/32/22 nm.
# 22 nm e o menor disponivel; o LARC do artigo-base e projetado para 1,5 nm, por isso os watts
# absolutos do McPAT NAO sao os do LARC e passam pela normalizacao da Secao 4.1 do artigo.
# vdd nao definido -> o McPAT usa o padrao ITRS do no (ver mcpat.py: "0 means using ITRS default").
[power]
technology_node = 22
