# larc_base.cfg - base comum aos 4 cenarios (A64FX_S, A64FX32, LARC_C, LARC_A)
# Uso: run-sniper -c /caminho/configs/<cenario>.cfg  (cada cenario faz #include larc_base)
# Sniper 8.1 (commit 56505e4). Hierarquia: L1I/L1D privadas + L2 compartilhada (sem L3).

# Sniper 8.1 exige a base do sistema (native_environment, mimicos, scheduler, ...) que o
# base.cfg antigo nao traz; sem ela o backend aborta com "Configuration value ... not found".
# native_environment=true cria o MMU sempre -> mmu_base.cfg e obrigatorio; com
# translation_enabled=false o memory_manager (linha 555) mapeia identidades, sem page walks.
#include ./common_configs/base_system_sniperspace.cfg
#include ./mmu_configs/mmu_base.cfg
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg
#include ./physical_memory_allocators/reserve_thp.cfg

[general]
enable_icache_modeling = true
total_cores = 32          # sobrescrito por cada cenario
# O artigo modela a hierarquia de cache diretamente (Tabela 1), sem MMU/page table;
# mantemos a traducao de enderecos desligada para nao introduzir trafego de page walk.
translation_enabled = false

[perf_model/core]
frequency = 2.2           # GHz (nominal)
logical_cpus = 1
type = interval
core_model = nehalem

[perf_model/core/interval_timer]
dispatch_width = 4
window_size = 128         # ROB de 128 entradas
num_outstanding_loadstores = 10

[perf_model/sync]
reschedule_cost = 1000

# base_system_sniperspace.cfg troca o escalonador para 'static' (1 thread por nucleo, sem fila).
# Um binario OpenMP com OMP_NUM_THREADS = total_cores cria 1 thread a mais que o numero de nucleos
# no frontend SDE e o 'static' aborta com "No cores available for spawnThread request".
# 'pinned' (padrao historico do Sniper) fixa cada thread num nucleo e admite a thread extra.
[scheduler]
type = pinned

[caching_protocol]
type = parametric_dram_directory_msi

# Bi-mode nao existe no Sniper; pentium_m (hibrido) e a aproximacao mais proxima disponivel.
# Registrar como limitacao na secao de Ameacas a Validade.
[perf_model/branch_predictor]
type = pentium_m
mispredict_penalty = 8
size = 16384

[perf_model/tlb]
penalty = 30
[perf_model/itlb]
size = 128
associativity = 4
[perf_model/dtlb]
size = 64
associativity = 4
[perf_model/stlb]
size = 512
associativity = 4

[perf_model/cache]
levels = 2                # L1 + L2 compartilhada (LLC = L2)
# MSHRs por cache: o cache_cntlr.cc do 8.1 exige a chave; o artigo nao especifica MSHRs.
# 64 e suficiente para cobrir os misses simultaneos de um core em streaming.
mshr_size = 64

# Sniper exige o mesmo cache_block_size em todos os niveis -> 256 B (linha do A64FX)
[perf_model/l1_icache]
perfect = false
cache_block_size = 256
cache_size = 64
associativity = 4
address_hash = mask
replacement_policy = lru
data_access_time = 2
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = none

[perf_model/l1_dcache]
perfect = false
cache_block_size = 256
cache_size = 64
associativity = 4
address_hash = mask
replacement_policy = lru
data_access_time = 2      # + tags_access_time 1 = 3 ciclos totais (Tabela 1 do artigo)
tags_access_time = 1
perf_model_type = parallel
writethrough = 0
shared_cores = 1
prefetcher = simple       # aproximacao do prefetcher de linha adjacente (ver nota no README)

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

# Sniper le as chaves do prefetcher 'simple' sem default no base.cfg -> startup error sem elas.
# num_prefetches = 1 com flows grandes = comportamento de proxima-linha (o mais proximo de
# "linha adjacente" do artigo). Ver simple_prefetcher.cc (flows, flows_per_core, num_prefetches).
[perf_model/l1_dcache/prefetcher/simple]
flows = 16
flows_per_core = true
num_prefetches = 1
stop_at_page_boundary = false

[perf_model/l2_cache]
perfect = false
cache_block_size = 256
associativity = 16
address_hash = mask
replacement_policy = lru
data_access_time = 27     # + tags_access_time 10 = 37 ciclos de hit na L2 (Tabela 1 do artigo).
tags_access_time = 10
perf_model_type = parallel
writethrough = 0
shared_cores = 32         # sobrescrito por cenario (12 no A64FX_S)
prefetcher = none
# cache_size e next_level_read_bandwidth definidos em cada cenario

[perf_model/llc]
evict_buffers = 8

[perf_model/metadata]
shadow_cache_enabled = "false"
shadow_cache_size = 16
shadow_cache_associativity = 8
shadow_cache_hit_latency = 1
shadow_cache_miss_latency = 2
passthrough_loc = 2

[perf_model/cache_usage]
enabled = false

# Memoria principal: 4 canais HBM2 x 64 GB/s = 256 GB/s por CMG.
# Sniper 8.1 so permite controladores de DRAM nos nos 'master' do cache compartilhado
# (memory_manager.cc:385) -> com uma unica L2 por CMG existe um unico controlador.
# Os 4 canais viram 1 controlador com a banda agregada (256 GB/s; 1600 no LARC_A),
# colocado em todos os nos master via controllers_interleaving = shared_cores.
# total_entries >= linhas da L2: LARC_A = 512 MiB / 256 B = 2.097.152 linhas; 4 Mi de entradas
# para nao haver evolucao de diretorio (invalidacoes falsas).
[perf_model/dram_directory]
total_entries = 4194304
associativity = 16
directory_type = full_map
# Granularidade de striping do diretorio/controladores: 2^8 = 256 B = 1 linha de cache
home_lookup_param = 8

[perf_model/dram]
type = constant
latency = 100
num_controllers = 1
controllers_interleaving = 32   # = shared_cores (sobrescrito por cenario)
per_controller_bandwidth = 256  # GB/s agregados dos 4 canais HBM2
chips_per_dimm = 8
dimms_per_controller = 4

[perf_model/cxl]
enabled = false

[network]
memory_model_1 = bus
memory_model_2 = bus
[network/bus]
bandwidth = 256
ignore_local_traffic = true

[dvfs]
type = simple
transition_latency = 0
[dvfs/simple]
cores_per_socket = 32     # um unico dominio de frequencia por CMG
