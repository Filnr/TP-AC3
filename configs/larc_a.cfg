# larc_a: LARC_A: 32 nucleos, L2 512 MiB, ~1,6 TB/s
#include larc_base

[general]
total_cores = 32

[perf_model/l2_cache]
cache_size = 524288            # KiB
shared_cores = 32

[dvfs/simple]
cores_per_socket = 32

[perf_model/l1_dcache]
# banda L1<->L2 por nucleo = 1600 GB/s / 32 nucleos, em bits/ciclo @2.2GHz
next_level_read_bandwidth = 182
next_level_write_bandwidth = 182

