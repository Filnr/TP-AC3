# a64fx_s: 1 CMG do A64FX real (12 nucleos, L2 8 MiB, ~800 GB/s)
#include larc_base

[general]
total_cores = 12

[perf_model/l2_cache]
cache_size = 8192            # KiB
shared_cores = 12

[dvfs/simple]
cores_per_socket = 12

[perf_model/l1_dcache]
# banda L1<->L2 por nucleo = 800 GB/s / 12 nucleos, em bits/ciclo @2.2GHz
next_level_read_bandwidth = 242
next_level_write_bandwidth = 242

[perf_model/dram]
controllers_interleaving = 12   # = shared_cores: 1 controlador de DRAM no unico master da L2
